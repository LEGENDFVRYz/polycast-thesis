{% macro folder_card(folder, view_type) %}
    <div class="folder-item">

        {% if view_type != 'trash' %}
            <button type="button" 
                    class="icon-button favorite-gallery-btn" 
                    data-gallery-id="{{ folder.id }}"
                    data-favorite-url="{{ url_for('gallery.toggle_gallery_favorite', gallery_id=folder.id) }}"
                    data-modal-target="#favoriteGalleryModal"
                    title="{{ 'Remove from Favorites' if folder.is_favorite else 'Add to Favorites' }}">
                
                <svg class="folder-favorite-icon" width="20" height="20" 
                     style="{% if not folder.is_favorite %}fill: none;{% endif %}"
                >
                    <use href="#gllry-folder-star"></use>
                </svg>
            </button>
        {% endif %}

        <div class="item-icon">
            <img src="{{ url_for('static', filename='images/icons/folder1.svg') }}">
        </div>

        <div class="item-info">
            <a href="{{ url_for('gallery.session_page', galleryname=folder.name) }}" class="folder-link-wrapper">
                <h3 class="item-title">{{ folder.name }}</h3>
            </a>
            <p class="item-subtitle">BSCPE 4-3</p>
        </div>

        <div class="item-actions">
            {% if view_type == 'trash' %}
                <button type="button" class="icon-button recover-gallery-btn" 
                        data-gallery-id="{{ folder.id }}" 
                        data-modal-target="#recoverGalleryModal"
                        data-recover-url="{{ url_for('gallery.recover_gallery', gallery_id=folder.id) }}">
                    <svg class="folder-icon" width="24" height="24">
                        <use href="#gllry-folder-rev"></use>
                    </svg>
                </button>
                
                <button type="button" class="icon-button force-delete-btn"
                        data-gallery-id="{{ folder.id }}"
                        data-modal-target="#forceDeleteGalleryModal"
                        data-force-url="{{ url_for('gallery.force_delete_gallery', gallery_id=folder.id) }}">
                    <svg class="folder-icon" width="24" height="24">
                        <use href="#gllry-folder-del"></use>
                    </svg>
                </button>

            {% else %}
                <button type="button" class="icon-button edit-session-btn" 
                        data-gallery-id="{{ folder.id }}" 
                        data-gallery-name="{{ folder.name }}"
                        data-modal-target="#editGalleryModal">
                    <svg class="folder-icon" width="24" height="24">
                        <use href="#gllry-folder-edit"></use>
                    </svg>
                </button>
                
                <button type="button" class="icon-button delete-session-btn"
                        data-modal-target="#deleteGalleryModal"
                        data-delete-url="{{ url_for('gallery.delete_gallery', gallery_id=folder.id) }}">
                    <svg class="folder-icon" width="24" height="24">
                        <use href="#gllry-folder-bins"></use>
                    </svg>
                </button>
            {% endif %}
        </div>
    </div>
{% endmacro %}
