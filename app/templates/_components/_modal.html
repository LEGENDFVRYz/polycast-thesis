{% macro modal_shell(modal_id, modal_title) %}
    <div id="{{ modal_id }}" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            
            <span class="modal-close-btn" data-close-modal>&times;</span>
            
            <h3>{{ modal_title }}</h3>
            
            <div class="modal-body">
                {{ caller() }}
            </div>
            
        </div>
    </div>
{% endmacro %}
