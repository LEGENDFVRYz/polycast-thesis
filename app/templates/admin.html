{% extends "base.html" %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content %}
    <div class="admin-ctn">
        <div class="admin-wrapper">
            <!-- PAGE TITILE -->
            <h1 class="page-title">System Configuration</h1>
            <a href="{{ url_for('logout_page') }}">Logout</a>
            
            <!-- Phase 1 -->
            <section class="config-card" id="prototype-config">
                <h2>Prototype Configuration</h2>

                {% if current_status == 'IDLE' %}
                    <form id="form2" action="{{ url_for('admin_start_host') }}" method="POST">
                        <div class="input-group">
                            <label for="ip-address">PolyCast IP Address</label>
                            <div class="input-with-button">
                                <input type="text" id="esp_ip" name="esp_ip" placeholder="Click 'Scan' to find...">
                                <button class="btn btn-secondary" id="scanBtn">Scan</button>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-full" id="configure-btn" type="submit">Configure Setup</button>
                    </form>
                {% endif %}
            </section>

            <!-- Phase 2 -->
            <section class="config-card disabled" id="note-config-active">
                <h2>Note Configuration</h2>

                {% if current_status == 'CONFIGURED' %}
                    <form id="form2" action="{{ url_for('admin_start_host') }}" method="POST">
                
                        <div class="input-group">
                            <label for="folder-name">Folder Name</label>
                            <div class="input-with-button">
                                <select id="folder-name">
                                    </select>
                                <button class="btn btn-secondary">New</button>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label for="session-name">Session Name</label>
                            <div class="input-with-button">
                                <select id="session-name">
                                    </select>
                                <button class="btn btn-secondary">New</button>
                            </div>
                        </div>
                        
                        <button class="btn btn-primary btn-full" id="start-stream-btn" disabled>Start Stream</button>
                    </form>
                {% endif %}
            </section>

        </div>
    </div>

    <!-- ESP SCANNER SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            
            const scanButton = document.getElementById('scanBtn');
            const ipInput = document.getElementById('esp_ip');

            scanButton.addEventListener('click', function() {
                
                // Initial Feedback
                scanButton.disabled = true;
                scanButton.textContent = 'Scanning...';
                ipInput.placeholder = 'Scanning for broadcast...';
                ipInput.value = ''; // Clear any old value

                // API Call: Prototype Scanner
                fetch("{{ url_for('scan_for_ip_route') }}")
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(err => {
                                throw new Error(err.message || 'Scan failed');
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.success) {
                            ipInput.value = data.ip; 
                            ipInput.placeholder = 'IP Found!';
                        }
                    })
                    .catch(error => {
                        console.error('Fetch error:', error);
                        ipInput.placeholder = error.message;
                    })
                    .finally(() => {
                        scanButton.disabled = false;
                        scanButton.textContent = 'Scan for ESP32';
                    });
            });
        });
    </script>

    <!-- COMBO BOX SCRIPT -->
    <script>
        // Data that would come from your Flask backend
        const ALL_OPTIONS = {{ gallery_data | safe }};

        // --- 1. Get DOM Elements ---
        const comboContainer = document.querySelector('.combo-container');
        const input = document.getElementById('gallery-input');
        const listbox = document.getElementById('gallery-listbox');

        let highlightedIndex = -1; // No option highlighted by default

        // --- 2. Core Functions ---

        /**
        * Filters and displays the options list based on the input value.
        */
        function filterAndShowOptions() {
            const filter = input.value.toLowerCase();
            
            // Get matching options
            const filteredOptions = ALL_OPTIONS.filter(option => 
                option.toLowerCase().includes(filter)
            );

            listbox.innerHTML = ''; // Clear old options
            
            if (filteredOptions.length === 0) {
                hideListbox();
                return;
            }

            // Create and add new option elements
            filteredOptions.forEach((option, index) => {
                const li = document.createElement('li');
                li.className = 'combo-option';
                li.role = 'option';
                li.id = `option-${index}`; // Unique ID for aria-activedescendant
                li.textContent = option;
                
                // Mouse click event
                li.addEventListener('mousedown', (e) => {
                    // 'mousedown' fires before 'blur' on the input
                    e.preventDefault(); 
                    selectOption(option);
                });
                
                listbox.appendChild(li);
            });
            
            showListbox();
        }

        /**
        * Selects an option, sets the input value, and closes the list.
        */
        function selectOption(option) {
            input.value = option;
            hideListbox();
        }

        /**
        * Shows the listbox and updates ARIA attributes.
        */
        function showListbox() {
            listbox.classList.remove('hidden');
            comboContainer.setAttribute('aria-expanded', 'true');
        }

        /**
        * Hides the listbox and resets ARIA/highlighting.
        */
        function hideListbox() {
            listbox.classList.add('hidden');
            comboContainer.setAttribute('aria-expanded', 'false');
            highlightedIndex = -1;
            input.removeAttribute('aria-activedescendant');
        }

        /**
        * Highlights an option in the list using the keyboard.
        */
        function highlightOption(index) {
            const options = listbox.querySelectorAll('.combo-option');
            
            // Remove previous highlight
            const prevOption = listbox.querySelector('.highlighted');
            if (prevOption) prevOption.classList.remove('highlighted');
            
            // Set new highlight
            const newOption = options[index];
            if (newOption) {
                newOption.classList.add('highlighted');
                
                // Tell screen reader which option is active
                input.setAttribute('aria-activedescendant', newOption.id);
                
                // Scroll the list to make the option visible
                newOption.scrollIntoView({ block: 'nearest' });
                
                highlightedIndex = index;
            }
        }


        // --- 3. Event Listeners ---

        // Show all options on click/focus
        input.addEventListener('focus', filterAndShowOptions);
        input.addEventListener('click', filterAndShowOptions);

        // Filter as user types
        input.addEventListener('input', filterAndShowOptions);

        // Hide on click outside
        document.addEventListener('click', (e) => {
            if (!comboContainer.contains(e.target)) {
                hideListbox();
            }
        });

        // CRITICAL: Keyboard Navigation
        input.addEventListener('keydown', (e) => {
            const options = listbox.querySelectorAll('.combo-option');
            if (listbox.classList.contains('hidden')) {
                // If list is hidden and user presses Down, show it
                if (e.key === 'ArrowDown' && options.length > 0) {
                    e.preventDefault();
                    showListbox();
                    highlightOption(0);
                }
                return;
            }

            switch (e.key) {
                case 'ArrowDown':
                    e.preventDefault(); // Stop cursor from moving in input
                    if (highlightedIndex < options.length - 1) {
                        highlightOption(highlightedIndex + 1);
                    }
                    break;
                    
                case 'ArrowUp':
                    e.preventDefault(); // Stop cursor from moving in input
                    if (highlightedIndex > 0) {
                        highlightOption(highlightedIndex - 1);
                    }
                    break;
                    
                case 'Enter':
                    e.preventDefault();
                    if (highlightedIndex > -1) {
                        selectOption(options[highlightedIndex].textContent);
                    }
                    break;
                    
                case 'Escape':
                    e.preventDefault();
                    hideListbox();
                    break;
            }
        });
    </script>

    <!-- UI HANDLER -->
    <script>
        const status = "{{ current_status }}";  // from Flask

        const phase2 = document.getElementById('phase2');

        if (status === 'CONFIGURED') {
            phase2.classList.remove('locked');
        }
    </script>
{% endblock %}
