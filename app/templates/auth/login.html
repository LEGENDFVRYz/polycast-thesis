{% extends "_layouts/auth.html" %}


{% block card_header %}
    Sign In your
    Admin Account
{% endblock %}

{% block card_content %}

    <!-- Auth Error Block  -->
    {% if error %}
        <div class="alert-error">{{ error }}</div>
    {% endif %}
    
    
    <!-- Sign In Form -->
    <form method="POST" id="signInForm">
        <div class="form-group">
            <input type="text" name="username" placeholder="Email/Phone Number" required data-max-length="80" title="Maximum 80 characters">
            <!-- This error message matches your image -->
            <p class="error-message" id="emailError" data-default-message="Incorrect email">Incorrect email</p>
        </div>

        <div class="form-group">
            <input type="password" name="password" placeholder="Password" required data-max-length="80" title="Maximum 80 characters">
            <p class="error-message" data-default-message="">Maximum 80 characters.</p>
        </div>

        <button type="submit" class="signin-button">Sign In</button>
    </form>

    <!-- Bottom Links -->
    <div class="links-container">
        <a href="#" class="forgot-password">Forgot Password?</a>
        <p class="signup-link">
            Don't have an account? <a href="{{ url_for('admin.register_page') }}">Sign Up for free</a>
        </p>
    </div>

{% endblock %}
