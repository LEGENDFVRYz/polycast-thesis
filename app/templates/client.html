{% extends "_layouts/base.html" %}

{% block inclusion %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/client.css') }}">
{% endblock %}

{% block content %}
    <div class="client-ctn">
        <div class="client-wrapper">
            <div class="client-card">
                <!-- temporary, minimized but can be optimized in other ways -->
                <img id="status-image" 
                    src="{{ url_for('static', filename='images/placeholder.png') }}" 
                    alt="status">

                <h1 id="status-comment">...</h1>
                <h3 id="status-message">connecting to server</h3>
                
                {# <div class="card-divider"></div> #}
                
                <!-- action button -->
                <a href="{{ url_for('stream.index') }}">
                    <button class="btn-stream">Go to Stream</button>
                </a>
            </div>
        </div>
    </div>

    <script>
        const statusImage   = document.getElementById('status-image');
        const statusComment = document.getElementById('status-comment');
        const statusMessage = document.getElementById('status-message');
        
        /* Pop-in on first load  */
        statusImage.onload = () => statusImage.classList.add('show');
    
        /* SSE Logic Update */
        const eventSource = new EventSource("{{ url_for('stream.status_updates') }}");
    
        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            console.log("Received status update:", data);
    
            /* Update text */
            statusComment.textContent = data.main_hook;
            statusMessage.textContent = data.status_detail;
    
            /* Smooth image swap — fade out → swap src → fade in */
            statusImage.classList.remove('show');
            setTimeout(() => {
                statusImage.src = `/static/${data.image}`;
                /* onload will re-add .show */
            }, 300);
        };
    
        eventSource.onerror = function(err) {
            console.error("EventSource failed:", err);
            statusComment.textContent = "Connection Error";
            statusMessage.textContent = "Please refresh or try again later.";
            eventSource.close();
        };
    </script>
{% endblock %}
