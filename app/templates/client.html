{% extends "base.html" %}

{% block extra_css %}
<style>
    .client-ctn {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        flex: 1;

        .client-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;

            #status-box {
                text-align: center;

                #status-message {
                    font-weight: 500;
                }
            }

            a {
                align-self: center;
                margin-top: 2rem;

                .button-temp {
                    background-color: #1a2c47;
                    color: white;
                    padding: 1rem;
                    border: none;
                    border-radius: 0.5rem;
                    font-size: 1rem;
                    font-weight: 600;
                    cursor: pointer;
                    width: 12em;
                    transition: background-color 0.3s;

                    &:hover {
                        background-color: #2b4a7a;
                    }
                }
            }
        }
    }
</style>
{% endblock %}

{% block content %}
    <div class="client-ctn">
        <div class="client-wrapper">
            <div id="status-box">
                <!-- temporary, minimized but can be optimized in other ways -->
                <img src="{{ url_for('static', filename='images/1.png') }}" alt="status" style="width:200px; height:200px;">
                <h1 id="status-comment">Hang tight!</h1>
                <h3 id="status-message">Waiting for admin setup</h3>
            </div>
            
            <a href="{{ url_for('stream_page') }}">
                <button class="button-temp">Go to Stream</button>
            </a>
            
        </div>
    </div>

    <script>
        // Get the element to update
        const statusMessage = document.getElementById('status-message');

        // 1. Create a new EventSource to connect to our SSE endpoint
        const eventSource = new EventSource("{{ url_for('status_updates') }}");

        // 2. Set up a listener for messages from the server
        eventSource.onmessage = function(event) {
            // Parse the JSON data from the server
            const data = JSON.parse(event.data);
            
            // Update the text on the page
            console.log("Received status update:", data.message);
            statusMessage.textContent = data.message;
        };

        // 3. (Optional) Handle connection errors
        eventSource.onerror = function(err) {
            console.error("EventSource failed:", err);
            statusMessage.textContent = "Error connecting to status server. Please refresh.";
            eventSource.close();
        };
    </script>
{% endblock %}
