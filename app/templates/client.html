{% extends "base.html" %}

{% block extra_css %}
<style>
    .client-ctn {
        font-family: 'Poppins-M';
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        flex: 1;

        .client-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;

            #status-box {
                text-align: center;

                #status-message {
                    font-weight: normal;
                    font-size: 17px;
                }
            }

            a {
                align-self: center;
                margin-top: 2rem;

                .button-temp {
                    font-family: 'Poppins-SB';
                    background-color: #1a2c47;
                    color: white;
                    padding: 1rem;
                    border: none;
                    border-radius: 0.5rem;
                    font-size: 1rem;
                    
                    cursor: pointer;
                    width: 12em;
                    transition: background-color 0.3s;

                    &:hover {
                        background-color: #2b4a7a;
                    }
                }
            }
        }
    }
</style>
{% endblock %}

{% block content %}
    <div class="client-ctn">
        <div class="client-wrapper">
            <div id="status-box">
                <!-- temporary, minimized but can be optimized in other ways -->
                <img id="status-image" 
                    src="{{ url_for('static', filename='images/1.png') }}" 
                    alt="status" 
                    style="width:200px; height:200px;">
                    <!-- add transition: opacity 0.5s; for fade effect -->
                <h1 id="status-comment">...</h1>
                <h3 id="status-message">connecting to server</h3>
            </div>
            
            <a href="{{ url_for('stream_page') }}">
                <button class="button-temp">Go to Stream</button>
            </a>
            
        </div>
    </div>

    <script>
        const statusImage = document.getElementById('status-image');
        const statusComment = document.getElementById('status-comment');
        const statusMessage = document.getElementById('status-message');

        const eventSource = new EventSource("{{ url_for('status_updates') }}");

        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            console.log("Received status update:", data);

            // Update text fields
            statusComment.textContent = data.main_hook;
            statusMessage.textContent = data.status_detail;

            // Smoothly change image
            // statusImage.style.opacity = 0;      // for fade  effect
            setTimeout(() => {
                statusImage.src = `/static/${data.image}`;
                // statusImage.style.opacity = 1;
            }, 300);
        };

        eventSource.onerror = function(err) {
            console.error("EventSource failed:", err);
            statusComment.textContent = "Connection Error";
            statusMessage.textContent = "Please refresh or try again later.";
            eventSource.close();
        };
    </script>
{% endblock %}
