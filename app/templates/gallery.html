{% extends "base.html" %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
    
{% endblock %}

{% block content %}
    <div class="gallery-wrap">

        <!-- Quick Actions -->
        <section class="quick-actions">
            <button class="qa-button active" data-icon-btn="home">
                <i data-lucide="home"></i>
                <span>Home</span>
            </button>
            <button class="qa-button" data-icon-btn="folder">
                <i data-lucide="folder"></i>
                <span>Folder</span>
            </button>
            <button class="qa-button" data-icon-btn="favorites">
                <i data-lucide="heart"></i>
                <span>Favorites</span>
            </button>
            <button class="qa-button" data-icon-btn="trash">
                <i data-lucide="trash-2"></i>
                <span>Trash</span>
            </button>
        </section>


        <!-- Recents -->
        <section class="recently-added">
            <h2 class="section-title">Recently Added</h2>
            <div class="recently-added__scroll-container">
                <!-- File Card 1 -->
                <div class="file-card">
                    <div class="fc-preview">
                        <i data-lucide="image"></i>
                    </div>
                    <div class="fc-info">
                        <span class="fc-name">File1 Name</span>
                        <button class="fc-menu-btn">
                            <i data-lucide="more-vertical"></i>
                        </button>
                    </div>
                </div>
                <!-- File Card 2 -->
                <div class="file-card">
                    <div class="fc-preview">
                        <i data-lucide="image"></i>
                    </div>
                    <div class="fc-info">
                        <span class="fc-name">File2 Name</span>
                        <button class="fc-menu-btn">
                            <i data-lucide="more-vertical"></i>
                        </button>
                    </div>
                </div>
                <!-- File Card 3 -->
                <div class="file-card">
                    <div class="fc-preview">
                        <i data-lucide="image"></i>
                    </div>
                    <div class="fc-info">
                        <span class="fc-name">File3 Name</span>
                        <button class="fc-menu-btn">
                            <i data-lucide="more-vertical"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>
        

        <!-- Folders -->
        <section class="folders">
            <h2 class="section-title">Folders</h2>
            <div class="folder-list">
                
                <!-- Loop through all available folders -->
                
                {% if folders %}  
                    {% for folder in folders %}

                        <a href="{{ url_for('session_page', galleryname=folder) }}" class="folder-link-wrapper">
                            <div class="folder-item">
                                <div class="item-icon">
                                    <!-- Use a custom filled-in folder icon -->
                                    <svg class="lucide lucide-folder" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="fill: #111827; color: #111827;">
                                        <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path>
                                    </svg>
                                </div>
                                <div class="item-info">
                                    <h3 class="item-title">{{ folder }}</h3>
                                    <p class="item-subtitle">BSCPE 4-3</p>
                                </div>
                                <button class="item-menu">
                                    <i data-lucide="more-vertical"></i>
                                </button>
                            </div>
                        </a>
                    {% endfor %}
                {% else %}
                    <p>No gallery folders found!</p>
                {% endif %}

            </div>
        </section>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', () => {
            // --- Quick Actions Button Navigation ---
            const iconButtons = document.querySelectorAll('.qa-button');
            const iconButtonsContainer = document.querySelector('.quick-actions');

            iconButtonsContainer.addEventListener('click', (e) => {
                const clickedButton = e.target.closest('.qa-button');
                if (!clickedButton) return; // Exit if click wasn't on a button

                // Remove active class from all buttons
                iconButtons.forEach(btn => {
                    btn.classList.remove('active');
                });

                // Add active class to the clicked button
                clickedButton.classList.add('active');

                // You could add logic here based on the clicked button
                // const activeBtn = clickedButton.dataset.iconBtn;
                // console.log('Active button:', activeBtn);
            });
        });
    </script>
{% endblock %}
