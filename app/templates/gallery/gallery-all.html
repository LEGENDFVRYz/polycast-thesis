{% extends "gallery/index.html" %}

{% block gallery_content %}
    <div class="gallery-page-header">
        <div class="banner-illustration">
            <img src="{{ url_for('static', filename='images/gllry-all.webp') }}" alt="Gallery Drawer">
        </div>

        <div class="banner-content">
            <h2>Admin Captured Galleries.</h2>
            <p>Most easiest way to manage each of your notes.</p>
        </div>
    </div>

    <section class="folders">
        <h2 class="folders-title">My Galleries</h2>

        <div class="folders-wrap">
            <div id="folders-mount">
                <div class="folders-list skeleton-list">
                    <div class="folder-item skeleton"></div>
                    <div class="folder-item skeleton"></div>
                    <div class="folder-item skeleton"></div>
                </div>
            </div>
        </div>
    </section>

    <script>
    (function () {
        function buildFolderCard(folder, count, isCurrentUser, viewType) {
            const isFav = folder.is_favorite;
            const sessionUrl = '/gallery/' + encodeURIComponent(folder.name);
            const favUrl    = '/gallery/' + folder.id + '/favorite';
            const editUrl   = '/gallery/' + folder.id + '/update';
            const deleteUrl = '/gallery/' + folder.id + '/delete';
            const recoverUrl = '/gallery/' + folder.id + '/recover';
            const forceUrl  = '/gallery/' + folder.id + '/force-delete';

            let actionBtns = '';
            if (isCurrentUser) {
                if (viewType === 'trash') {
                    actionBtns = `
                        <button type="button" class="icon-button recover-gallery-btn"
                                data-gallery-id="${folder.id}"
                                data-modal-target="#recoverGalleryModal"
                                data-recover-url="${recoverUrl}">
                            <svg class="folder-icon" width="24" height="24"><use href="#gllry-folder-rev"></use></svg>
                        </button>
                        <button type="button" class="icon-button force-delete-btn"
                                data-gallery-id="${folder.id}"
                                data-modal-target="#forceDeleteGalleryModal"
                                data-force-url="${forceUrl}">
                            <svg class="folder-icon" width="24" height="24"><use href="#gllry-folder-del"></use></svg>
                        </button>`;
                } else {
                    actionBtns = `
                        <button type="button" class="icon-button edit-session-btn"
                                data-gallery-id="${folder.id}"
                                data-gallery-name="${folder.name}"
                                data-modal-target="#editGalleryModal">
                            <svg class="folder-icon" width="24" height="24"><use href="#gllry-folder-edit"></use></svg>
                        </button>
                        <button type="button" class="icon-button delete-session-btn"
                                data-modal-target="#deleteGalleryModal"
                                data-delete-url="${deleteUrl}">
                            <svg class="folder-icon" width="24" height="24"><use href="#gllry-folder-bins"></use></svg>
                        </button>`;
                }
            } else {
                actionBtns = `<svg class="chevron-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>`;
            }

            const favBtn = viewType !== 'trash' ? `
                <button type="button" class="icon-button favorite-gallery-btn"
                        data-gallery-id="${folder.id}"
                        data-favorite-url="${favUrl}"
                        data-modal-target="#favoriteGalleryModal"
                        title="${isFav ? 'Remove from Favorites' : 'Add to Favorites'}">
                    <svg class="folder-favorite-icon" width="20" height="20" style="${isFav ? '' : 'fill: none;'}">
                        <use href="#gllry-folder-star"></use>
                    </svg>
                </button>` : '';

            return `
                <div class="folder-item">
                    <a href="${sessionUrl}" class="card-link-overlay" aria-label="Open ${folder.name}"></a>
                    ${favBtn}
                    <div class="item-icon">
                        <svg width="20" height="20"><use href="#gllry-banner-folder"></use></svg>
                    </div>
                    <div class="item-info">
                        <h3 class="item-title">${folder.name}</h3>
                        <div class="item-meta">
                            <span class="item-session-count">${count} sessions</span>
                            <span class="item-separator">·</span>
                            <span class="item-activity">${folder.created_at}</span>
                        </div>
                    </div>
                    <div class="item-actions">${actionBtns}</div>
                </div>`;
        }

        function buildEmptyState() {
            return `<div class="empty-state">
                <div class="empty-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                              d="m22 19-2 2H4l-2-2V6l2-2h6l2 3h8l2 2z"/>
                    </svg>
                </div>
                <h3>No galleries yet!</h3>
                <p>Start streaming to capture and organize your notes.</p>
            </div>`;
        }

        document.addEventListener('DOMContentLoaded', function () {
            fetch('/api/gallery/list?view=all')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    const mount = document.getElementById('folders-mount');
                    const galleries = data.galleries;
                    const counts = data.session_counts;
                    const isCurrentUser = data.is_current_user;

                    if (!galleries.length) {
                        mount.innerHTML = buildEmptyState();
                        return;
                    }

                    const html = galleries.map(function (f) {
                        return buildFolderCard(f, counts[String(f.id)] || 0, isCurrentUser, 'all');
                    }).join('');
                    mount.innerHTML = '<div class="folders-list">' + html + '</div>';
                })
                .catch(function () {
                    document.getElementById('folders-mount').innerHTML =
                        '<p class="error-notice">Could not load galleries.</p>';
                });
        });
    }());
    </script>
{% endblock %}
