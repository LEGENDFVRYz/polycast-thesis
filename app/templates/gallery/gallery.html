{% extends "base.html" %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
    
{% endblock %}

{% block content %}
    <div class="gallery-wrap gallery-scope">

        <!-- Quick Actions -->
        <section class="quick-actions">
            <button class="qa-button active" data-icon-btn="home">
                <image src="../static/images/icons/home.svg">
                <span>Home</span>
            </button>
            <button class="qa-button" data-icon-btn="folder">
                <image src="../static/images/icons/folder1.svg">
                <span>Folder</span>
            </button>
            <button class="qa-button" data-icon-btn="favorites">
                <image src="../static/images/icons/favorites.svg">
                <span>Favorites</span>
            </button>
            <button class="qa-button" data-icon-btn="trash">
                <image src="../static/images/icons/trash.svg">
                <span>Trash</span>
            </button>
        </section>


        <!-- Recents -->
        <section class="recently-added">
            <h2 class="section-title">Recently Added</h2>
            <div class="recently-added__scroll-container">
                <!-- File Card 1 -->
                <div class="file-card">
                    <div class="fc-preview">
                        <image src="../static/images/icons/image1.svg">
                    </div>
                    <div class="fc-info">
                        <span class="fc-name">IMG_1230</span>
                        <button class="fc-menu-btn">
                            <image src="../static/images/icons/dots.svg">
                        </button>
                    </div>
                </div>
                <!-- File Card 2 -->
                <div class="file-card">
                    <div class="fc-preview">
                        <image src="../static/images/icons/image1.svg">
                    </div>
                    <div class="fc-info">
                        <span class="fc-name">IMG_7381</span>
                        <button class="fc-menu-btn">
                            <image src="../static/images/icons/dots.svg">
                        </button>
                    </div>
                </div>
                <!-- File Card 3 -->
                <div class="file-card">
                    <div class="fc-preview">
                        <image src="../static/images/icons/image1.svg">
                    </div>
                    <div class="fc-info">
                        <span class="fc-name">IMG_4212</span>
                        <button class="fc-menu-btn">
                            <image src="../static/images/icons/dots.svg">
                        </button>
                    </div>
                </div>
            </div>
        </section>
        

        <!-- Folders -->
        <section class="folders">
            <h2 class="section-title">Folders</h2>
            <div class="folder-list">
                
                <!-- Loop through all available folders -->
                
                {% if folders %}  
                    {% for folder in folders %}

                        <a href="{{ url_for('session_page', galleryname=folder) }}" class="folder-link-wrapper">
                            <div class="folder-item">
                                <div class="item-icon">
                                    <image src="../static/images/icons/folder1.svg">
                                </div>
                                <div class="item-info">
                                    <h3 class="item-title">{{ folder }}</h3>
                                    <p class="item-subtitle">BSCPE 4-3</p>
                                </div>
                                <button class="item-menu">
                                    <image src="../static/images/icons/dots.svg">
                                </button>
                            </div>
                        </a>
                    {% endfor %}
                {% else %}
                    <p>No gallery folders found!</p>
                {% endif %}

            </div>
        </section>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', () => {
            // --- Quick Actions Button Navigation ---
            const iconButtons = document.querySelectorAll('.qa-button');
            const iconButtonsContainer = document.querySelector('.quick-actions');

            iconButtonsContainer.addEventListener('click', (e) => {
                const clickedButton = e.target.closest('.qa-button');
                if (!clickedButton) return; // Exit if click wasn't on a button

                // Remove active class from all buttons
                iconButtons.forEach(btn => {
                    btn.classList.remove('active');
                });

                // Add active class to the clicked button
                clickedButton.classList.add('active');

                // You could add logic here based on the clicked button
                // const activeBtn = clickedButton.dataset.iconBtn;
                // console.log('Active button:', activeBtn);
            });
        });
    </script>
{% endblock %}
