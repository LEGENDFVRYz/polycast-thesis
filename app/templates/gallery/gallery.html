{% extends "gallery/index.html" %}

{% block gallery_content %}
    <div class="gallery-page-header">
        <div class="banner-illustration">
            <img src="{{ url_for('static', filename='images/gllry-def.webp') }}" alt="Paper Home">
        </div>

        <div class="banner-content">
            <h2>Explore the Vast Galleries.</h2>
            <p>Most recent and shortcut access to all system notes.</p>
        </div>
    </div>

    <!-- Recent Sessions -->
    <section class="recent-sessions" id="recent-sessions-section" style="display:none;">
        <div class="sessions-header">
            <h2>Recent Sessions:</h2>
        </div>
        <div class="sessions-wrap">
            <div class="sessions-list" id="sessions-mount"></div>
        </div>
    </section>

    <!-- Quick Access Folders -->
    <section class="folders">
        <div class="folders-header">
            <h2>Quick Access</h2>
            <a href="{{ url_for('gallery.all_galleries') }}" class="view-all-link">View all</a>
        </div>

        <div class="folders-wrap">
            <div id="folders-mount">
                <div class="folders-list skeleton-list">
                    <div class="folder-item skeleton"></div>
                    <div class="folder-item skeleton"></div>
                    <div class="folder-item skeleton"></div>
                </div>
            </div>
        </div>
    </section>

    <script>
    (function () {
        function buildSessionCard(s, isCurrentUser) {
            const actionBtn = isCurrentUser ? `
                <button type="button" class="icon-button session-menu-btn"
                        data-session-id="${s.id}"
                        data-gallery-id="${s.gallery_id}"
                        data-modal-target="#sessionActionModal"
                        title="Session options">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="5" r="2"/>
                        <circle cx="12" cy="12" r="2"/>
                        <circle cx="12" cy="19" r="2"/>
                    </svg>
                </button>` :
                `<svg class="chevron-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>`;

            return `
                <div class="session-item">
                    <a href="${s.view_url}" class="card-link-overlay"
                       aria-label="Open ${s.name} from ${s.gallery_name}"></a>
                    <div class="session-thumbnail">
                        ${s.thumbnail_url
                            ? `<img class="thumbnail-image" src="${s.thumbnail_url}" alt="${s.name}">`
                            : `<div class="thumbnail-placeholder"></div>`
                        }
                    </div>
                    <div class="session-info">
                        <h3 class="session-title">${s.name}</h3>
                        <p class="session-gallery">${s.gallery_name}</p>
                    </div>
                    <div class="session-actions">${actionBtn}</div>
                </div>`;
        }

        function buildFolderCard(folder, count, isCurrentUser) {
            const isFav      = folder.is_favorite;
            const sessionUrl = '/gallery/' + encodeURIComponent(folder.name);
            const favUrl     = '/gallery/' + folder.id + '/favorite';
            const deleteUrl  = '/gallery/' + folder.id + '/delete';

            const actionBtns = isCurrentUser ? `
                <button type="button" class="icon-button edit-session-btn"
                        data-gallery-id="${folder.id}"
                        data-gallery-name="${folder.name}"
                        data-modal-target="#editGalleryModal">
                    <svg class="folder-icon" width="24" height="24"><use href="#gllry-folder-edit"></use></svg>
                </button>
                <button type="button" class="icon-button delete-session-btn"
                        data-modal-target="#deleteGalleryModal"
                        data-delete-url="${deleteUrl}">
                    <svg class="folder-icon" width="24" height="24"><use href="#gllry-folder-bins"></use></svg>
                </button>` :
                `<svg class="chevron-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>`;

            return `
                <div class="folder-item">
                    <a href="${sessionUrl}" class="card-link-overlay" aria-label="Open ${folder.name}"></a>
                    <button type="button" class="icon-button favorite-gallery-btn"
                            data-gallery-id="${folder.id}"
                            data-favorite-url="${favUrl}"
                            data-modal-target="#favoriteGalleryModal"
                            title="${isFav ? 'Remove from Favorites' : 'Add to Favorites'}">
                        <svg class="folder-favorite-icon" width="20" height="20" style="${isFav ? '' : 'fill: none;'}">
                            <use href="#gllry-folder-star"></use>
                        </svg>
                    </button>
                    <div class="item-icon">
                        <svg width="20" height="20"><use href="#gllry-banner-folder"></use></svg>
                    </div>
                    <div class="item-info">
                        <h3 class="item-title">${folder.name}</h3>
                        <div class="item-meta">
                            <span class="item-session-count">${count} sessions</span>
                            <span class="item-separator">·</span>
                            <span class="item-activity">${folder.created_at}</span>
                        </div>
                    </div>
                    <div class="item-actions">${actionBtns}</div>
                </div>`;
        }

        function buildEmptyFolders() {
            return `<div class="empty-state-wrapper">
                <div class="empty-state">
                    <div class="empty-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="m22 19-2 2H4l-2-2V6l2-2h6l2 3h8l2 2z"/>
                        </svg>
                    </div>
                    <h3>No galleries yet!</h3>
                    <p>Start streaming to capture and organize your notes.</p>
                </div>
            </div>`;
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Fetch both endpoints in parallel
            Promise.all([
                fetch('/api/gallery/recent-sessions').then(function (r) { return r.json(); }),
                fetch('/api/gallery/list?view=all').then(function (r) { return r.json(); })
            ]).then(function (results) {
                var sessData    = results[0];
                var folderData  = results[1];
                var isCurrentUser = sessData.is_current_user || folderData.is_current_user;

                // --- Recent sessions ---
                var sessions = sessData.sessions || [];
                if (sessions.length) {
                    var sessHtml = sessions.map(function (s) {
                        return buildSessionCard(s, isCurrentUser);
                    }).join('');
                    document.getElementById('sessions-mount').innerHTML = sessHtml;
                    document.getElementById('recent-sessions-section').style.display = '';
                }

                // --- Quick-access folders (first 5) ---
                var galleries = (folderData.galleries || []).slice(0, 5);
                var counts    = folderData.session_counts || {};
                var foldersMount = document.getElementById('folders-mount');

                if (!galleries.length) {
                    foldersMount.innerHTML = buildEmptyFolders();
                    return;
                }
                var folderHtml = galleries.map(function (f) {
                    return buildFolderCard(f, counts[String(f.id)] || 0, isCurrentUser);
                }).join('');
                foldersMount.innerHTML = '<div class="folders-list">' + folderHtml + '</div>';
            }).catch(function () {
                document.getElementById('folders-mount').innerHTML = buildEmptyFolders();
            });
        });
    }());
    </script>
{% endblock %}
