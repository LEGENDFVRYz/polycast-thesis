{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
{% endblock %}

{% block content %}
<div class="view-wrap gallery-scope">

    <!-- Added by Timothy @ 11/27/2025-->
    <!-- Header component -->
    <header class="header">
        <!-- Back Button and Session Title -->
        <div class="header-left">
            <a href="{{ url_for('session_page', galleryname=galleryname) }}" class="icon-button back-button">
                <img src="{{ url_for('static', filename='images/icons/arrow-right.svg') }}" alt="Back">
            </a>
            <h1>{{ sessionname }}</h1>
        </div>

        <!-- Action Menu -->
        <div class="header-right">
            <button data-action="Share" id="shareBtn" class="icon-button action-button">
                <img src="{{ url_for('static', filename='images/icons/share.svg') }}" alt="Share">
            </button>
            <button data-action="Download" id="downloadAllBtn" class="icon-button action-button">
                <img src="{{ url_for('static', filename='images/icons/download.svg') }}" alt="Download" id="downloadIcon">
            </button>
        </div>
    </header>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const shareBtn = document.getElementById('shareBtn');
            
            shareBtn.addEventListener('click', function() {
                const pageUrl = window.location.href;

                // Fallback method for older browsers
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(pageUrl).then(() => {
                        alert('Page URL copied to clipboard!');
                    }).catch(err => {
                        console.error('Failed to copy via Clipboard API: ', err);
                    });
                } else {
                    // Fallback using a temporary input element
                    const tempInput = document.createElement('input');
                    tempInput.value = pageUrl;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    try {
                        document.execCommand('copy');
                        alert('Page URL copied to clipboard!');
                    } catch (err) {
                        console.error('Fallback copy failed: ', err);
                    }
                    document.body.removeChild(tempInput);
                }
            });
        });

        document.getElementById('downloadAllBtn').addEventListener('click', function() {
            const btn = this;
            const icon = document.getElementById('downloadIcon');

            // Replace icon with "Preparing..." text
            btn.innerHTML = 'Preparing...';
            btn.disabled = true; // optional: disable to prevent multiple clicks

            // Simulate download process (replace this with actual download logic)
            // If you're fetching a file via JS, this is where you handle it
            setTimeout(() => {
                // Download finished
                // Restore original icon
                btn.innerHTML = '';
                const img = document.createElement('img');
                img.src = "{{ url_for('static', filename='images/icons/download.svg') }}";
                img.alt = "Download";
                img.id = "downloadIcon"; // restore id
                btn.appendChild(img);
                btn.disabled = false;
            }, 2000); // simulate 2 seconds of download
        });
    </script>
    <!-- End of Addition by Timothy @ 11/27/2025-->


    <!-- Image Viewer -->
    <div class="image-grid" id="imageGrid">
        {% if images %}
            {% for image in images %}
                <div class="image-card">
                    <img 
                        data-src="{{ url_for('serve_gallery_image', filename=base_url ~ '/' ~ image) }}"
                        alt="{{ image }}"
                        data-filename="{{ image }}"
                        class="lazy-image"
                        loading="lazy">
                </div>
            {% endfor %}
        {% else %} 
            <p>This folder is empty.</p>
        {% endif %}
    </div>
</div>


<!-- Uses JSZip (MIT License) - https://stuk.github.io/jszip/ -->
<script src="{{ url_for('static', filename='js/jszip.min.js') }}"></script>

<!-- Uses FileSaver.js (MIT License) - https://github.com/eligrey/FileSaver.js/ -->
<script src="{{ url_for('static', filename='js/FileSaver.min.js') }}"></script>

<script>
/* --- LAZY LOADING IMAGES --- */
document.addEventListener("DOMContentLoaded", () => {
    const lazyImages = document.querySelectorAll(".lazy-image");

    const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src; 
                img.classList.add("loaded");
                obs.unobserve(img);
            }
        });
    }, {
        rootMargin: "200px", // preload slightly before visible
        threshold: 0.1
    });

    lazyImages.forEach(img => observer.observe(img));
});


/* --- DOWNLOAD ALL --- */
document.getElementById("downloadAllBtn").addEventListener("click", async () => {
    const btn = document.getElementById("downloadAllBtn");
    btn.textContent = "Preparing...";
    btn.disabled = true;

    const zip = new JSZip();
    const images = document.querySelectorAll(".lazy-image");
    let count = 0;

    for (const img of images) {
        const url = img.dataset.src || img.src; // use data-src if not yet loaded
        const filename = img.dataset.filename;

        try {
            // Use cache if possible — prevents re-downloading
            const response = await fetch(url, { cache: "force-cache" });
            const blob = await response.blob();
            zip.file(filename, blob);
        } catch (err) {
            console.error("Error fetching", url, err);
        }

        count++;
        btn.textContent = `Preparing... (${count}/${images.length})`;
    }

    const content = await zip.generateAsync({ type: "blob" });
    saveAs(content, "{{ foldername }}.zip");

    // btn.textContent = "⬇️ Download All";
    btn.disabled = false;
});
</script>
{% endblock %}
