{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
{% endblock %}

{% block content %}
<div class="view-wrap gallery-scope">

    <!-- Header component -->
    <header class="header">
        <!-- Back Button and Session Title -->
        <div class="header-left">
            <a href="{{ url_for('session_page', galleryname=galleryname) }}" class="icon-button back-button">
                <image src="../../static/images/icons/arrow-right.svg">
            </a>
            <h1>{{ sessionname }}</h1>
        </div>

        <!-- Action Menu -->
        <div class="header-right">
            <button data-action="Share" class="icon-button action-button">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 5.314 9.566 5.314m0 0a2.25 2.25 0 1 0 0 2.186 2.25 2.25 0 0 0 0-2.186m0 0-9.566-5.314" />
                </svg>
            </button>
            <button data-action="Download" id="downloadAllBtn" class="icon-button action-button">
                <image src="../../static/images/icons/download.svg">
            </button>
        </div>
    </header>


    <!-- Image Viewer -->
    <div class="image-grid" id="imageGrid">
        {% if images %}
            {% for image in images %}
                <div class="image-card">
                    <img 
                        data-src="{{ url_for('serve_gallery_image', filename=base_url ~ '/' ~ image) }}"
                        alt="{{ image }}"
                        data-filename="{{ image }}"
                        class="lazy-image"
                        loading="lazy">
                </div>
            {% endfor %}
        {% else %} 
            <p>This folder is empty.</p>
        {% endif %}
    </div>
</div>


<!-- Uses JSZip (MIT License) - https://stuk.github.io/jszip/ -->
<script src="{{ url_for('static', filename='js/jszip.min.js') }}"></script>

<!-- Uses FileSaver.js (MIT License) - https://github.com/eligrey/FileSaver.js/ -->
<script src="{{ url_for('static', filename='js/FileSaver.min.js') }}"></script>

<script>
/* --- LAZY LOADING IMAGES --- */
document.addEventListener("DOMContentLoaded", () => {
    const lazyImages = document.querySelectorAll(".lazy-image");

    const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src; 
                img.classList.add("loaded");
                obs.unobserve(img);
            }
        });
    }, {
        rootMargin: "200px", // preload slightly before visible
        threshold: 0.1
    });

    lazyImages.forEach(img => observer.observe(img));
});


/* --- DOWNLOAD ALL --- */
document.getElementById("downloadAllBtn").addEventListener("click", async () => {
    const btn = document.getElementById("downloadAllBtn");
    btn.textContent = "Preparing...";
    btn.disabled = true;

    const zip = new JSZip();
    const images = document.querySelectorAll(".lazy-image");
    let count = 0;

    for (const img of images) {
        const url = img.dataset.src || img.src; // use data-src if not yet loaded
        const filename = img.dataset.filename;

        try {
            // Use cache if possible — prevents re-downloading
            const response = await fetch(url, { cache: "force-cache" });
            const blob = await response.blob();
            zip.file(filename, blob);
        } catch (err) {
            console.error("Error fetching", url, err);
        }

        count++;
        btn.textContent = `Preparing... (${count}/${images.length})`;
    }

    const content = await zip.generateAsync({ type: "blob" });
    saveAs(content, "{{ foldername }}.zip");

    // btn.textContent = "⬇️ Download All";
    btn.disabled = false;
});
</script>
{% endblock %}
