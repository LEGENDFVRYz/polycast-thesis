{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/gallery_folderview.css') }}">
{% endblock %}

{% block content %}
<div class="gallery-wrap">
    <a href="{{ url_for('gallery_page') }}" class="back-link">← Back to Gallery</a>

    <h1>Viewing: {{ foldername }}</h1>

    <button id="downloadAllBtn" class="download-all-btn">⬇️ Download All</button>

    <div class="image-grid" id="imageGrid">
        {% if images %}
            {% for image in images %}
                <div class="image-card">
                    <img 
                        data-src="{{ url_for('static', filename='gallery_images/' + foldername + '/' + image) }}"
                        alt="{{ image }}"
                        data-filename="{{ image }}"
                        class="lazy-image"
                        loading="lazy">
                </div>
            {% endfor %}
        {% else %}
            <p>This folder is empty.</p>
        {% endif %}
    </div>
</div>

<!-- JSZip + FileSaver -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
/* --- LAZY LOADING IMAGES --- */
document.addEventListener("DOMContentLoaded", () => {
    const lazyImages = document.querySelectorAll(".lazy-image");

    const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src; 
                img.classList.add("loaded");
                obs.unobserve(img);
            }
        });
    }, {
        rootMargin: "200px", // preload slightly before visible
        threshold: 0.1
    });

    lazyImages.forEach(img => observer.observe(img));
});


/* --- DOWNLOAD ALL --- */
document.getElementById("downloadAllBtn").addEventListener("click", async () => {
    const btn = document.getElementById("downloadAllBtn");
    btn.textContent = "Preparing...";
    btn.disabled = true;

    const zip = new JSZip();
    const images = document.querySelectorAll(".lazy-image");
    let count = 0;

    for (const img of images) {
        const url = img.dataset.src || img.src; // use data-src if not yet loaded
        const filename = img.dataset.filename;

        try {
            // Use cache if possible — prevents re-downloading
            const response = await fetch(url, { cache: "force-cache" });
            const blob = await response.blob();
            zip.file(filename, blob);
        } catch (err) {
            console.error("Error fetching", url, err);
        }

        count++;
        btn.textContent = `Preparing... (${count}/${images.length})`;
    }

    const content = await zip.generateAsync({ type: "blob" });
    saveAs(content, "{{ foldername }}.zip");

    btn.textContent = "⬇️ Download All";
    btn.disabled = false;
});
</script>
{% endblock %}
