{% extends "base.html" %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
    
{% endblock %}

{% block content %}
    <div class="gallery-wrap">




        <!-- Folders -->
        <section class="folders">
            <h2 class="section-title">Session:</h2>
            <div class="folder-list">
                
                <!-- Loop through all available folders -->
                
                {% if sessions %}  
                    {% for session in sessions %}

                        <a href="{{ url_for('folderview_page', galleryname=selected_gallery, sessionname=session) }}" class="folder-link-wrapper">
                            <div class="folder-item">
                                <div class="item-icon">
                                    <!-- Use a custom filled-in folder icon -->
                                    <svg class="lucide lucide-folder" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="fill: #111827; color: #111827;">
                                        <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path>
                                    </svg>
                                </div>
                                <div class="item-info">
                                    <h3 class="item-title">{{ session }}</h3>
                                    <p class="item-subtitle">BSCPE 4-3</p>
                                </div>
                                <button class="item-menu">
                                    <i data-lucide="more-vertical"></i>
                                </button>
                            </div>
                        </a>
                    {% endfor %}
                {% else %}
                    <p>No Session found!</p>
                {% endif %}

            </div>
        </section>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', () => {
            // --- Quick Actions Button Navigation ---
            const iconButtons = document.querySelectorAll('.qa-button');
            const iconButtonsContainer = document.querySelector('.quick-actions');

            iconButtonsContainer.addEventListener('click', (e) => {
                const clickedButton = e.target.closest('.qa-button');
                if (!clickedButton) return; // Exit if click wasn't on a button

                // Remove active class from all buttons
                iconButtons.forEach(btn => {
                    btn.classList.remove('active');
                });

                // Add active class to the clicked button
                clickedButton.classList.add('active');

                // You could add logic here based on the clicked button
                // const activeBtn = clickedButton.dataset.iconBtn;
                // console.log('Active button:', activeBtn);
            });
        });
    </script>
{% endblock %}
