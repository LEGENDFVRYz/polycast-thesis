
<!-- Quick Actions -->
<section class="quick-actions">
    <button class="qa-button active" id="config" data-icon-btn="home">
        <image src="../static/images/icons/settings1.svg">
        <span>Config</span> 
    </button>
    <button class="qa-button" data-icon-btn="folder">
        <image src="../static/images/icons/stream3.svg">
        <span>Live</span>
    </button>
    <button class="qa-button" data-icon-btn="favorites">
        <image src="../static/images/icons/playback.svg">
        <span>Playback</span>
    </button>
</section>


<!-- Integrated Styles -->
<style>
    .quick-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
    
        .qa-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;

            padding: 1rem 0.5rem;
            background-color: #ffffff;
            border: 1px solid #000425;
            border-radius: 1rem;

            font-family: 'Inter';
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            
            &:hover {
                background-color: #DBEEFF;
            }
    
            img {
                width: 24px;
                height: 24px;
                filter: brightness(0) saturate(100%) invert(13%) sepia(27%) saturate(1489%) hue-rotate(173deg) brightness(95%) contrast(93%);
                transition: color 0.2s;
            }
        }

        #config {
            // grid-column: span 2;
        }
    
        .qa-button.active {
            background-color: #DBEEFF;
            border: none;
            
        }
    }
</style>


<!-- Integrated JS -->
<script>
    lucide.createIcons();

    document.addEventListener('DOMContentLoaded', () => {
        // --- Quick Actions Button Navigation ---
        const iconButtons = document.querySelectorAll('.qa-button');
        const iconButtonsContainer = document.querySelector('.quick-actions');

        iconButtonsContainer.addEventListener('click', (e) => {
            const clickedButton = e.target.closest('.qa-button');
            if (!clickedButton) return; // Exit if click wasn't on a button

            // Remove active class from all buttons
            iconButtons.forEach(btn => {
                btn.classList.remove('active');
            });

            // Add active class to the clicked button
            clickedButton.classList.add('active');

            // You could add logic here based on the clicked button
            // const activeBtn = clickedButton.dataset.iconBtn;
            // console.log('Active button:', activeBtn);
        });
    });
</script>
