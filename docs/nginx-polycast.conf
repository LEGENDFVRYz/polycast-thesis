# PolyCast NGINX reverse proxy config
# Deploy: sudo cp docs/nginx-polycast.conf /etc/nginx/sites-available/polycast
#         sudo ln -s /etc/nginx/sites-available/polycast /etc/nginx/sites-enabled/polycast
#         sudo nginx -t && sudo systemctl reload nginx

# WebSocket upgrade resolver (used by /ws/ below).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;          # Matches any hostname / direct IP access on the LAN

    # ------------------------------------------------------------------
    # 1. STATIC ASSETS
    # ------------------------------------------------------------------
    location /static/ {
        alias /home/polycastadmin/esp32_mock_webserver/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # 2. GALLERY IMAGES (archive/)
    # ------------------------------------------------------------------
    location /gallery_images/ {
        alias /home/polycastadmin/esp32_mock_webserver/archive/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ------------------------------------------------------------------
    # 3. MJPEG STREAM — proxy_buffering OFF is mandatory
    # MJPEG STREAM is an infinite multipart/x-mixed-replace stream.
    # proxy_read_timeout 3600s keeps the connection open for a full hour.
    # ------------------------------------------------------------------
    location /video_feed {
        proxy_pass         http://127.0.0.1:5050;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }

    # ------------------------------------------------------------------
    # 4. SERVER-SENT EVENTS — proxy_buffering OFF required
    # SSE is a long-lived text/event-stream connection.
    # Buffering would batch events and deliver them late (or never).
    # X-Accel-Buffering: no tells any intermediate proxy to also disable.
    # ------------------------------------------------------------------
    location /status_updates {
        proxy_pass          http://127.0.0.1:5050;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_http_version  1.1;
        proxy_set_header    Connection '';
        add_header          X-Accel-Buffering no;
    }

    # ------------------------------------------------------------------
    # 5. WEBSOCKET — proxies the in-process browser broadcaster (port 5001)
    # behind the same origin so clients only need to know about port 80.
    # ------------------------------------------------------------------
    location /ws/ {
        proxy_pass         http://127.0.0.1:5051/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # 6. ALL OTHER ROUTES → Gunicorn (dynamic Flask responses)
    # Gzip compresses HTML, CSS, JS, and JSON in transit over the LAN.
    # gzip_comp_level 4 balances CPU cost vs. compression ratio on the Pi.
    # gzip_min_length 1024 skips compressing tiny responses.
    # ------------------------------------------------------------------
    location / {
        proxy_pass              http://127.0.0.1:5050;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        gzip                    on;
        gzip_types              text/css application/javascript application/json text/plain;
        gzip_min_length         1024;
        gzip_comp_level         4;
        gzip_vary               on;
    }
}
