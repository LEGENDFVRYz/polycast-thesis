# ----------------------------------------------------
# PolyCast - conda environment (cross-platform)
#
#   conda env create -f environment.yml
#   conda activate polycast
#
# Pip users can skip this file entirely:
#   python3.12 -m venv .venv && pip install -r requirements.txt
#
# Runtime deps live in requirements.txt so the two never
# drift; this file only pins the interpreter and pulls
# those in.
#
# Python is pinned to 3.12: the pinned numpy/scipy publish
# no cp313 wheels. See requirements.txt.
# ----------------------------------------------------
name: polycast

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip

  - pip:
      - -r requirements.txt
      # Drop the line below if you only need the web server
      # and not the pipeline self-tests / debug dashboard.
      - -r requirements-dev.txt
