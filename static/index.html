<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pen API Visual Renderer</title>
    <style>
        body {
            background: #121212;
            color: #eee;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .info-box {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 10px;
            width: 90%;
            max-width: 800px;
        }

        .info-box h3 {
            margin: 0 0 5px 0;
            color: #00ff88;
            font-size: 16px;
        }

        .info-value { color: #00bfff; }

        .canvas-container {
            border: 2px solid #00ff88;
            border-radius: 8px;
            background: #000;
            width: 90%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            position: relative;
            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #status {
            position: absolute;
            top: 5px;
            left: 10px;
            color: #00ff88;
            font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 3px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="info-box">
        <h3>🧭 API Endpoints</h3>
        <div>
            Endpoints:
            x: <span class="info-value" id="valX">0</span>,
            y: <span class="info-value" id="valY">0</span>,
            pressure: <span class="info-value" id="valP">0</span>
        </div>
        <div>
            WebSocket: <code>ws://127.0.0.1:8000/ws</code>
        </div>
    </div>

    <div class="canvas-container">
        <div id="status">Connecting...</div>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const status = document.getElementById("status");

        const valX = document.getElementById("valX");
        const valY = document.getElementById("valY");
        const valP = document.getElementById("valP");

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const MAX_X = 35560;
        const MAX_Y = 22219;
        const MAX_PRESSURE = 8191;

        function scaleX(x) { return (x / MAX_X) * canvas.width; }
        function scaleY(y) { return (y / MAX_Y) * canvas.height; }

        let lastX = null, lastY = null;

        // Connect to WebSocket
        const ws = new WebSocket(`ws://${location.host}/ws`);
        ws.onopen = () => status.textContent = "Connected";
        ws.onclose = () => status.textContent = "Disconnected";
        ws.onerror = () => status.textContent = "Error";

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const x = scaleX(data.x);
            const y = scaleY(data.y);
            const p = data.pressure;

            valX.textContent = data.x;
            valY.textContent = data.y;
            valP.textContent = p;

            drawConnected(x, y, p);
        };

        function drawConnected(x, y, pressureRaw) {
            const pressure = pressureRaw / MAX_PRESSURE;
            if (lastX === null || lastY === null) {
                lastX = x;
                lastY = y;
                return;
            }

            ctx.strokeStyle = `rgba(0,255,100,${0.3 + pressure * 0.7})`;
            ctx.lineWidth = 1 + pressure * 3;
            ctx.lineCap = "round";

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            // If pressure is weak (0–100), erase it after 3 seconds
            if (pressureRaw <= 100) {
                const lx = lastX, ly = lastY, cx = x, cy = y;
                const lw = ctx.lineWidth;

                setTimeout(() => {
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = lw + 1; // slightly thicker erase
                    ctx.beginPath();
                    ctx.moveTo(lx, ly);
                    ctx.lineTo(cx, cy);
                    ctx.stroke();
                }, 1000);
            }

            lastX = x;
            lastY = y;
        }

        // Periodic cleanup
        setInterval(() => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            lastX = lastY = null;
        }, 60000);
    </script>
</body>
</html>
