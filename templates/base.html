<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Pinterest-Style Navigation</title>
    <style>
        /* ===== Reset + Base ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
            background: #f5f5f5;
            color: #333;
        }

        /* ===== Floating Sidebar (Desktop) ===== */
        nav {
            background: white;
            width: 70px;
            height: 400px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            border-radius: 70px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);

            position: fixed;
            top: 50%;
            left: 30px;
            transform: translateY(-50%);
            z-index: 1000;
            padding: 20px 0;
            transition: all 0.3s ease;
        }
        nav:hover {
            box-shadow: 0 3px 9px rgba(0, 0, 0, 0.2);
            transform: translateY(-50%) scale(1.01);
        }
        nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 25px;
            height: 100%;
        }
        nav ul li {
            text-align: center;
        }
        nav ul li a {
            text-decoration: none;
            color: #555;
            font-size: 24px;
            transition: all 0.2s ease;
        }
 

        /* ===== Main content ===== */
        main {
            flex: 1;
            padding: 40px;
            margin-left: 140px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 100vh;
            max-width: 1200px;
            width: 100%;
            margin-right: auto;
            margin-left: 140px;
            padding: 40px;
            box-sizing: border-box;
        }
        @media (min-width: 1300px) {
            main {
                margin-left: calc(50% - 600px + 70px);
            }
        }
        main h1, main p {
            margin-bottom: 20px;
        }
        main .button {
            display: inline-block;
            margin-right: 15px;
            margin-top: 10px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.2s;
        }
        main .button:hover {
            background: #0056b3;
        }


        /* ===== Mobile floating bottom nav ===== */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            nav {
                flex-direction: row;
                bottom: 20px;
                left: 50%;
                right: auto;
                top: auto;
                transform: translateX(-50%);
                width: 90%;
                height: 65px;
                border-radius: 35px;
                justify-content: space-around;
                padding: 0 10px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            }
            nav ul {
                flex-direction: row;
                gap: 30px;
                height: auto;
            }
            main {
                flex: 1;
                margin: 0;
                padding: 20px;
                margin-bottom: 100px;
                width: 100%;
                max-width: 100%;
                min-height: calc(100vh - 100px);
            }
        }

    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <ul>
            {% if is_setup %}
                <li><a href="#">🎞️</a></li>
                <li><a href="#">📂</a></li>
            {% endif %}
            
            <li><a href="{{ url_for('client_page') }}">📸</a></li>
        </ul>
    </nav>

    <!-- Main content -->
    <main>
        {% block content %}
            <!-- Page-specific content will go here -->

        {% endblock %}
    </main>


    <script>
        // Optional: Add active state toggle
        const links = document.querySelectorAll('nav a');
        links.forEach(link => {
        link.addEventListener('click', () => {
            links.forEach(l => l.classList.remove('active'));
            link.classList.add('active');
        });
        });
    </script>
</body>
</html>
